version: '3.8'

x-security-defaults: &security-defaults
  network_mode: none
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 2G

services:
  test:
    <<: *security-defaults
    build: .
    container_name: llm_bias_unit_tests
    command: python -m unittest tests/test_auditor.py

  auditor:
    <<: *security-defaults
    build: .
    container_name: llm_bias_counterfactual_auditor
    volumes:
      - ./reports:/app/reports
    command: python src/run_counterfactual_audit.py

  benchmark:
    <<: *security-defaults
    build: .
    container_name: llm_bias_ground_truth_benchmark
    volumes:
      - ./reports:/app/reports
    command: python src/evaluate_ground_truth_benchmark.py

  inconsistency:
    <<: *security-defaults
    build: .
    container_name: llm_bias_behavioral_inconsistency
    volumes:
      - ./reports:/app/reports
    command: python src/evaluate_behavioral_inconsistency.py

  statistical:
    <<: *security-defaults
    build: .
    container_name: llm_bias_statistical_rigor
    volumes:
      - ./reports:/app/reports
    command: python src/analyze_statistical_rigor.py

  sensitivity:
    <<: *security-defaults
    build: .
    container_name: llm_bias_sensitivity_analysis
    volumes:
      - ./reports:/app/reports
    command: python src/run_sensitivity_analysis.py
