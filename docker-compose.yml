x-security-defaults: &security-defaults
  network_mode: none  # Sandbox: Disable container internet/network access for safe code execution

services:
  # 1. Dataset Generation
  dataset:
    <<: *security-defaults
    build: .
    container_name: llm_bias_dataset_generator
    volumes:
      - .:/app
    command: python src/dataset_generation/generate_unified_dataset.py

  # 2. Logic Auditing Engine
  audit:
    <<: *security-defaults
    build: .
    container_name: llm_bias_logic_auditor
    volumes:
      - .:/app
    command: python src/logic_auditing/run_audit_dynamic.py

  # 3. Statistical Analysis (Table 1 Metrics)
  metrics:
    <<: *security-defaults
    build: .
    container_name: llm_bias_metrics_calculator
    volumes:
      - .:/app
    command: python src/statistical_analysis/compute_rigorous_metrics.py

  # 4. McNemar Exact Test
  mcnemar:
    <<: *security-defaults
    build: .
    container_name: llm_bias_mcnemar_test
    volumes:
      - .:/app
    command: python src/statistical_analysis/compute_mcnemar_exact.py

  # 5. Visualization (Paper Figures)
  figures:
    <<: *security-defaults
    build: .
    container_name: llm_bias_figure_generator
    volumes:
      - .:/app
    command: python src/visualization/generate_paper_figures.py

  # 6. Model Code Generation (Gemini Legacy - Condition 1)
  generate-gemini-legacy:
    build: .
    container_name: llm_bias_gemini_legacy_generator
    environment:
      - GEMINI_API_KEY
    volumes:
      - .:/app
    command: python src/model_generation/generate_functions.py --input data/dataset/prompts_old.jsonl --output data/generated_functions_gemini_legacy

  # 7. Model Code Generation (Gemini Expanded - Condition 2)
  generate-gemini-expanded:
    build: .
    container_name: llm_bias_gemini_expanded_generator
    environment:
      - GEMINI_API_KEY
    volumes:
      - .:/app
    command: python src/model_generation/generate_functions.py --input data/dataset/prompts_expanded_new.jsonl --output data/generated_functions_gemini_expanded

  # 8. Model Code Generation (Gemini Unified - Condition 3)
  generate-gemini-unified:
    build: .
    container_name: llm_bias_gemini_unified_generator
    environment:
      - GEMINI_API_KEY
    volumes:
      - .:/app
    command: python src/model_generation/generate_functions.py --input data/dataset/prompts_unified_new.jsonl --output data/generated_functions_gemini_unified

  # 9. Model Code Generation (Grok Unified - Condition 4)
  generate-grok-unified:
    build: .
    container_name: llm_bias_grok_unified_generator
    environment:
      - XAI_API_KEY
    volumes:
      - .:/app
    command: python src/model_generation/generate_functions_grok.py --input data/dataset/prompts_unified_new.jsonl --output data/generated_functions_grok_unified

